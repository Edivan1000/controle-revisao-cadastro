<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Controle de Revisão de Cadastro</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Controle de Revisão de Cadastro</h1>
  </header>

  <main class="container">

    <!-- TELA INICIAL -->
    <section id="inicio">

      <h2>Selecione o sistema</h2>

      <div class="sistemas">

        <button
          class="sistema-btn"
          onclick="mostrarSistema('VR')">
          VR
        </button>

        <button
          class="sistema-btn"
          onclick="mostrarSistema('SYSMO')">
          SYSMO
        </button>

        <button
          class="sistema-btn"
          onclick="mostrarSistema('ATIMACOM')">
          ATIMACOM
        </button>

        <button
          class="sistema-btn"
          onclick="mostrarSistema('SIIT')">
          SIIT
        </button>

        <button
          class="sistema-btn"
          onclick="mostrarSistema('GR TECNOLOGIA')">
          GR TECNOLOGIA
        </button>

      </div>

    </section>


    <!-- TELA DO SISTEMA -->
    <section id="telaSistema" class="oculto">

      <button
        class="voltar"
        onclick="voltarInicio()">
        ← Voltar
      </button>

      <h2 id="tituloSistema"></h2>

      <div id="conteudo"></div>

    </section>

  </main>


  <script src="script.js"></script>

</body>
</html>
